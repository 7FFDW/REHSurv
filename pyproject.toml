[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "path-evidence-surv"
version = "0.1.0"
description = "REHSurv: Report Evidence-guided Hypergraph Network for Multimodal Survival Prediction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "h5py>=3.9", "scipy>=1.10", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]
